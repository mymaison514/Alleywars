<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>HoboWars Offline RPG — Complete Edition</title>
<style>
:root {
  --bg-primary: #121212;
  --bg-card: #1e1e1e;
  --bg-header: #282828;
  --text-main: #e0e0e0;
  --text-muted: #a0a0a0;
  --accent-gold: #ffb703;
  --accent-green: #4caf50;
  --accent-red: #f44336;
  --accent-blue: #2196f3;
  --border-color: #333333;
  --nav-height: 56px;
  --topbar-height: 70px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  background: var(--bg-primary);
  color: var(--text-main);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  padding-top: var(--topbar-height);
  padding-bottom: calc(var(--nav-height) + 10px);
  user-select: none;
}

a { color: var(--accent-blue); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
a.x { color: var(--text-muted); pointer-events: none; }

#topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--topbar-height);
  background: var(--bg-header);
  border-bottom: 2px solid var(--accent-gold);
  padding: 4px 8px;
  z-index: 100;
  font-size: 12px;
  display: flex; flex-direction: column; justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

.top-row { display: flex; justify-content: space-between; align-items: center; }
.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
.stat-box { background: rgba(0,0,0,0.3); padding: 2px; border-radius: 4px; font-size: 11px; }

.bar { height: 6px; border: 1px solid #444; background: #222; margin: 1px 0; border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; transition: width 0.3s ease; }

#c { padding: 10px; max-width: 800px; margin: auto; }

h2 { font-size: 18px; margin: 8px 0 12px; border-bottom: 1px solid var(--accent-gold); padding-bottom: 4px; color: var(--accent-gold); display: flex; justify-content: space-between; align-items: center; }
h3 { font-size: 15px; margin: 10px 0 6px; color: #fff; border-bottom: 1px dashed var(--border-color); padding-bottom: 2px; }

.box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; margin: 8px 0; box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
.col { display: flex; flex-wrap: wrap; gap: 10px; }
.col > div { flex: 1; min-width: 140px; }

table.t { border-collapse: collapse; width: 100%; font-size: 12px; margin: 6px 0; }
.t td, .t th { border: 1px solid var(--border-color); padding: 6px 4px; text-align: left; }
.t th { background: rgba(255,255,255,0.05); color: var(--accent-gold); }
.t tr:nth-child(even) { background: rgba(255,255,255,0.02); }

button, input, select {
  font: inherit; padding: 6px 10px;
  background: #2a2a2a; color: #fff;
  border: 1px solid #444; border-radius: 4px;
  outline: none; margin: 2px 0;
}
button { cursor: pointer; background: #333; transition: background 0.2s; font-weight: bold; }
button:hover { background: #444; }
button:active { background: #222; }
button.btn-gold { background: #8a6d00; border-color: var(--accent-gold); }
button.btn-gold:hover { background: #b38f00; }
button.btn-danger { background: #8a1c1c; border-color: var(--accent-red); }
button.btn-danger:hover { background: #b32424; }

.g { color: var(--accent-green); }
.r { color: var(--accent-red); }
.m { color: var(--text-muted); font-size: 11px; }

/* Interactive Exploration Grid */
.map-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  max-width: 350px;
  margin: 10px auto;
  touch-action: manipulation;
}
.cell {
  aspect-ratio: 1;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
}
.cell.cur { background: var(--accent-gold); color: #000; border-color: #fff; box-shadow: 0 0 8px var(--accent-gold); }
.cell.adj { background: #1b3b1b; border-color: var(--accent-green); color: var(--accent-green); }
.cell.adj:hover { background: #285828; }
.cell.vis { background: #333; }
.cell.unreachable { opacity: 0.3; cursor: not-allowed; }

/* Fixed Bottom Navigation Bar */
#botnav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--nav-height);
  background: var(--bg-header);
  border-top: 2px solid var(--accent-gold);
  display: flex; justify-content: space-around; align-items: center;
  z-index: 100;
  box-shadow: 0 -2px 8px rgba(0,0,0,0.5);
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-item {
  flex: 1; text-align: center; color: var(--text-muted);
  font-size: 10px; display: flex; flex-direction: column; align-items: center;
  padding: 4px 0; cursor: pointer; text-decoration: none !important;
}
.nav-item i { font-style: normal; font-size: 18px; margin-bottom: 2px; }
.nav-item.active { color: var(--accent-gold); font-weight: bold; }

.log { max-height: 220px; overflow-y: auto; font: 11px monospace; background: #000; padding: 6px; border-radius: 4px; border: 1px solid #333; }
.tag { display: inline-block; padding: 2px 6px; border-radius: 10px; font-size: 10px; font-weight: bold; margin-right: 4px; }
.tag-district { background: #334455; color: #88ccff; }
.tag-war { background: #552222; color: #ff8888; }

.badge { background: var(--accent-gold); color: #000; padding: 1px 5px; border-radius: 8px; font-size: 10px; font-weight: bold; }
</style>
</head>

const FN = 'Dex Mara Jonas Lena Otis Pearl Ruben Tilda Cal Nell Gus Vera Moe Ida Hank Rosa Abe Faye Lou Wren Ned Opal Sid Tess Bo Cora Walt Dot Finn Edie Amber Chloe Jasmine Marcus Sarah'.split(' ');
const LN = 'Ravenhurst Mudge Pike Okafor Brandt Quill Sorensen Dabrowski Tamm Hollis Vance Ng Ferreira Lund Abbott Kessler Rowe Imani Castellan Boggs Yoder Marlow Pruitt Santos'.split(' ');
const ADJ = 'Rusty Lucky Greasy Quiet Slick Dusty Mad Lazy Tin Old Slick Mean Shadow'.split(' ');
const NOUN = 'Pete Bandit Pigeon Duke Nails Sparrow Hawk Mule Biscuit Fox Viper Bear Raven'.split(' ');

/* ===== STATE MANAGEMENT ===== */
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const rf = (a, b) => a + Math.random() * (b - a);
const need = l => Math.round(56 * Math.pow(l, 1.6));
const mhpOf = l => 20 + (l - 1) * 10;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const f2 = n => (+n).toFixed(2);
const money = n => '$' + Math.floor(n).toLocaleString();
const pk = a => a[rnd(0, a.length - 1)];

function pname() {
  const r = Math.random();
  return r < 0.4 ? pk(FN) + ' ' + pk(LN) : r < 0.65 ? pk(ADJ) + ' ' + pk(NOUN) : r < 0.85 ? pk(FN).toLowerCase() + pk(LN).slice(0, 3) + rnd(1, 99) : 'The ' + pk(NOUN) + ' ' + rnd(2, 9);
}

function newState(n) {

    set: { pace: 'relaxed', sim: 1, sandbox: false, protect: true, unl: false, chat: 1, cheat: { hp: true, T: true, meals: true, free: true, reqs: true, stats: true } },
    rt: { rg: t, rs: t, sim: t }, log: [], feed: [], mail: 1,

    cart: { type: 'basic', upgrades: {} }, cartRaces: 0, cartWins: 0,
    skills: {}, tattoos: {}, drunkUntil: 0, drinkBuff: 0,

    districts: {
      north: { owner: 1 }, west: { owner: 2 }, east: { owner: 3 },
      south: { owner: 4 }, industrial: { owner: 5 }, waterfront: { owner: 6 }

    wars: [], pawnItems: []
  };
  st.players = genPop();
  st.gangs = genGangs(st.players);

}

let S = null, view = 'home', note = '', memOnly = false;

function lg(m, c) {
  if (!S) return;
  S.log.unshift({ t: new Date().toLocaleTimeString(), m, c: c || '' });
  if (S.log.length > 150) S.log.length = 150;
}

/* ===== SAVE & VALIDATION ===== */
function save() {
  if (!S) return;
  try { localStorage.setItem(CONFIG.KEY, JSON.stringify(S)); }
  catch (e) { memOnly = true; }
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(CONFIG.KEY); } catch (e) { memOnly = true; }
  if (!raw) return;
  try {
    const parsed = JSON.parse(raw);
    S = parsed;
    if (!S.districts) S.districts = newState('Temp').districts;
    if (!S.cart) S.cart = { type: 'basic', upgrades: {} };
    if (!S.skills) S.skills = {};
    if (!S.tattoos) S.tattoos = {};
    if (!S.rels) S.rels = {};
    if (!S.achievements) S.achievements = {};
    if (!S.gangApps) S.gangApps = [];
    tick();
  } catch (e) {
    console.error("Save load error:", e);
    note = 'Error loading save file. Initialized backup.';
  }
}

/* ===== SIMULATION ENGINE ===== */
function PR() { return CONFIG.presets[S.set.pace] || CONFIG.presets.relaxed; }

function lvlUp(o) {
  while (o.xp >= need(o.lv)) {
    o.xp -= need(o.lv);
    o.lv++;
  }
}

function gainXp(n) {
  let m = 1 + (S.eq.ring && GEAR[S.eq.ring].x === 'exp' ? GEAR[S.eq.ring].v * 0.05 : 0);
  if (S.spouse) m += 0.1; // Spouse buff
  S.xp += Math.round(n * m);
  const l = S.lv;
  lvlUp(S);
  if (S.lv > l) {
    S.hp = mhpOf(S.lv);
    lg('LEVEL UP! Reached Level ' + S.lv + '. Life restored.', 'g');
    S.evq.push({ t: 'lvl' });
  }
  checkAchievements();
}

function spendT(a) {
  if (cz('T')) return;
  if (S.T >= 100) S.rt.rg = Date.now();
  S.T -= a;
}

function tick() {
  if (!S) return;
  const n = Date.now(), p = PR(), rg = p.regen * 1000 * (don() ? 2 / 3 : 1);
  
  if (cz('T')) { S.T = 100; S.rt.rg = n; }
  else if (S.T >= 100 || S.rt.rg > n) S.rt.rg = n;
  else {
    const c = Math.floor((n - S.rt.rg) / rg);
    if (c > 0) {
      S.T = Math.min(100, S.T + 5 * c);
      S.rt.rg += c * rg;
      if (S.T >= 100) S.rt.rg = n;
    }
  }

  if (cz('hp')) S.hp = mhpOf(S.lv);
  if (cz('meals')) S.meals = 5;

  if (S.rt.rs > n) S.rt.rs = n;
  if (n - S.rt.rs >= p.reset * 1000) {
    newDay();
    S.rt.rs = n;
  }

  if (S.drunkUntil && n > S.drunkUntil) {
    S.drunkUntil = 0;
    S.drinkBuff = 0;
    lg('You are no longer drunk.');
  }

  simRun(n);
}

function newDay() {
  S.turns = Math.max(S.turns, 0) < CONFIG.presets[S.set.pace].turns ? CONFIG.presets[S.set.pace].turns : S.turns;
  S.meals = 5; S.tref = 0; S.ptr = 0; S.tokref = 0; S.uni = { score: 0, rr: 0 };
  if (don()) S.turns = Math.round(S.turns * 1.25);
  lg('A new day begins: turns, meals and daily limits reset.');
}

const ev = s => s <= 500 ? s : 500 + (s - 500) * 0.8;

function myCombat() {
  let s = ev(S.str), p = ev(S.pow), sp = ev(S.spd);
  const w = S.eq.wep ? GEAR[S.eq.wep].v : 0;
  const a = S.eq.arm ? GEAR[S.eq.arm].v : 0;
  
  // Skill & drink buffs
  p += (S.drinkBuff || 0);
  p += (S.skills.brawler || 0) * 2;
  
  // Tattoo buffs
  if (S.tattoos.anchor) s += 2;
  if (S.tattoos.skull) p += 5;
  if (S.tattoos.lightning) sp += 10;

  const r = S.rats.find(x => x.id === S.rat);
  const rp = r ? r.pow / 2 : 0, rs = r ? r.spd / 2 : 0, rd = r ? r.str / 4 : 0;
  
  return {
    dmg: [s / 6 + p / 2 + w + rp, s / 4 + 0.75 * p + w + rp],
    def: [s / 3 + a + rd, s / 2 + a + rd],
    spd: [sp / 4, sp + rs],
    hp: S.hp
  };
}

function oppCombat(p) {
  const s = ev(p.str), pw = ev(p.pow), sp = ev(p.spd);
  return {
    dmg: [s / 6 + pw / 2 + p.wp, s / 4 + 0.75 * pw + p.wp],
    def: [s / 3 + p.ar, s / 2 + p.ar],
    spd: [sp / 4, sp],
    hp: mhpOf(p.lv)
  };
}

function duel(a, b, out) {
  let r = 0;
  while (a.hp > 0 && b.hp > 0 && r < 200) {
    r++;
    const sa = rf(a.spd[0], a.spd[1]), sb = rf(b.spd[0], b.spd[1]);
    const na = sa >= sb ? Math.min(10, Math.max(1, Math.round(sa / Math.max(sb, 0.5)))) : 1;
    const nb = sb > sa ? Math.min(10, Math.max(1, Math.round(sb / Math.max(sa, 0.5)))) : 1;
    
    let da = 0, db = 0;
    for (let i = 0; i < na && b.hp > 0; i++) {
      const d = Math.max(0, rf(a.dmg[0], a.dmg[1]) - rf(b.def[0], b.def[1]));
      b.hp -= d; da += d;
    }
    for (let i = 0; i < nb && b.hp > 0 && a.hp > 0; i++) {
      const d = Math.max(0, rf(b.dmg[0], b.dmg[1]) - rf(a.def[0], a.def[1]));
      a.hp -= d; db += d;
    }
    if (r <= 6) {
      out.push(`Round ${r}: hit ${na}x for ${f2(da)} | foe hit ${nb}x for ${f2(db)}`);
    }
  }
  return r >= 200 ? 0 : a.hp > 0 ? 1 : -1;
}

function checkAchievements() {
  if (!S) return;
  ACHIEVEMENTS.forEach(ach => {
    if (!S.achievements[ach.id] && ach.check(S)) {
      S.achievements[ach.id] = true;
      lg(`ACHIEVEMENT UNLOCKED: ${ach.n}! (${ach.reward})`, 'g');
    }
  });
}

function mkPlayer(i) {
  const L2 = 1 + Math.floor(Math.pow(Math.random(), 2.2) * 45);
  const sp = [rf(0.5, 1.4), rf(0.5, 1.4), rf(0.5, 1.4)];
  const b = g => +(2 + (L2 - 1) * rf(0.8, 2.2) * g).toFixed(2);
  const t = Date.now();
  return {
    id: 100000 + i * 13 + rnd(0, 12), n: pname(), age: rnd(18, 45), sx: pk(['M', 'M', 'F', 'F', 'N']),
    pers: pk(PERS), style: pk(STYLES), app: mkApp(), gang: 0, gr: '', lv: L2, xp: rnd(0, need(L2) - 1),
    spd: b(sp[0]), pow: b(sp[1]), str: b(sp[2]), wp: rnd(0, L2 * 3), ar: rnd(0, L2 * 2), cash: rnd(0, L2 * 150),
    w: rnd(0, L2 * 4), l: rnd(0, L2 * 4), act: t - rnd(0, 36e5), mem: { win: 0, loss: 0, fav: 0, chats: 0 }, hist: []
  };
}

function genPop() {
  const used = new Set(), P = [];
  for (let i = 0; i < CONFIG.pop; i++) {
    const p = mkPlayer(i);
    let t = 0;
    while (used.has(p.n) && t++ < 20) p.n = pname();
    used.add(p.n);
    P.push(p);
  }
  return P;
}

function genGangs(P) {
  const G2 = GN.map((g, i) => ({
    id: i + 1, n: g[0], c: GCOL[i], th: g[1], lv: rnd(2, 14), xp: rnd(0, 500), tr: rnd(5e3, 5e5),
    min: GMIN[i], rv: 0, wins: rnd(0, 30), loss: rnd(0, 30), lead: 0, me: false, feed: [],
    hist: 'Founded around the old district.'
  }));
  G2.forEach((g, i) => g.rv = G2[(i + rnd(1, G2.length - 1)) % G2.length].id);
  
  const by = P.slice().sort((a, b) => b.lv - a.lv);
  G2.forEach(g => {
    const l = by.find(p => !p.gang && p.lv >= g.min);
    if (l) { l.gang = g.id; g.lead = l.id; }
  });
  
  P.forEach(p => {
    if (p.gang || Math.random() < 0.2) return;
    const el = G2.filter(g => g.min <= p.lv);
    if (el.length) p.gang = pk(el).id;
  });
  return G2;
}

/* ===== SIMULATION TICK RUNNER ===== */
function simRun(n) {
  if (!S || !S.set.sim) return;
  const P = S.players;
  // Dynamic NPC AI actions
  for (let k = 0; k < 5; k++) {
    const p = P[rnd(0, P.length - 1)];
    p.act = n;
    if (Math.random() < 0.3) {
      p.xp += rnd(2, 8);
      lvlUp(p);
    }
  }

  // NPC Gang applications logic
  if (S.gang && Math.random() < 0.1) {
    const myG = S.gangs.find(g => g.id === S.gang);
    if (myG && (myG.me || myG.lead === S.id)) {
      const applicant = P.find(p => !p.gang && p.lv >= myG.min && !S.gangApps.some(a => a.id === p.id));
      if (applicant) {
        S.gangApps.push(applicant);
        if (S.gangApps.length > 10) S.gangApps.shift();
      }
    }
  }
}

    S.eq[g.k] = id;
    return `Equipped ${g.n}!`;
  },

  resetAll() {
    if (!confirm('Delete progress and restart?')) return '';
    try { localStorage.removeItem(CONFIG.KEY); } catch (e) {}
    S = null; view = 'home';
    render();
    return '';
  }
};

/* ===== UI RENDERING ENGINE ===== */
function setView(v) {
  view = v;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function topbar() {
  if (!S) return;
  const mx = mhpOf(S.lv);
  document.getElementById('topbar').innerHTML = `
    <div class="top-row">
      <b>${esc(S.name)} (Lv ${S.lv})</b>
      <span>${money(S.cash)} | Pts: ${S.pts}</span>
    </div>
    <div class="stat-grid">
      <div class="stat-box">HP: ${Math.ceil(S.hp)}/${mx}${bar(S.hp, mx, '#4caf50')}</div>
      <div class="stat-box">Awake: ${S.T}/100${bar(S.T, 100, '#f44336')}</div>
      <div class="stat-box">Turns: ${S.set.unl ? '∞' : S.turns}${bar(S.turns, 100, '#2196f3')}</div>
      <div class="stat-box">XP: ${S.xp}/${need(S.lv)}${bar(S.xp, need(S.lv), '#ffb703')}</div>
    </div>
  `;
}

function botnav() {
  const items = [
    { id: 'home', icon: '🏠', label: 'Home' },
    { id: 'explore', icon: '🗺️', label: 'Explore' },
    { id: 'city', icon: '🌆', label: 'City' },
    { id: 'fight', icon: '⚔️', label: 'Fight' },
    { id: 'gang', icon: '👥', label: 'Gang' }
  ];
  document.getElementById('botnav').innerHTML = items.map(it => `
    <a class="nav-item ${view === it.id ? 'active' : ''}" onclick="setView('${it.id}')">
      <i>${it.icon}</i>
      <span>${it.label}</span>
    </a>
  `).join('');
}

const VIEWS = {
  home() {

        <button onclick="setView('achievements')">Achievements</button>
        <button onclick="setView('settings')">Settings</button>
      </div>

      <h3>Recent Activity Log</h3>
      <div class="log">${S.log.map(l => `<div class="${l.c}">${esc(l.t)} ${esc(l.m)}</div>`).join('')}</div>
    `;
  },

  explore() {
    const N = CONFIG.gridN;
    const curX = S.pos.x, curY = S.pos.y;
    let gridHtml = '<div class="map-grid">';
    
    for (let dy = -3; dy <= 3; dy++) {
      for (let dx = -3; dx <= 3; dx++) {
        const x = curX + dx, y = curY + dy;
        const isCur = dx === 0 && dy === 0;
        const isAdj = Math.abs(dx) <= 1 && Math.abs(dy) <= 1 && !isCur;
        const isValid = x >= 0 && y >= 0 && x < N && y < N;

        if (!isValid) {
          gridHtml += `<div class="cell unreachable">×</div>`;
        } else if (isCur) {
          gridHtml += `<div class="cell cur">YOU</div>`;
        } else if (isAdj) {
          gridHtml += `<div class="cell adj" onclick="act('moveGrid', ${x}, ${y})">${x},${y}</div>`;
        } else {
          gridHtml += `<div class="cell vis">${x},${y}</div>`;
        }
      }
    }
    gridHtml += '</div>';

    return `
      <h2>City Exploration Grid</h2>
      <p class="m">Tap any adjacent green tile to step forward. Costs 1 turn per move.</p>
      <p>Position: (${curX}, ${curY}) | Turns Remaining: <b>${S.set.unl ? '∞' : S.turns}</b> | Cans: ${S.cans}</p>
      ${S.map ? gridHtml : '<p class="r">You need a City Map ($10) to explore! Buy one at WalMart.</p>'}
      
      <h3>Scavenge Log</h3>
      <div class="log">${S.finds.map(f => `<div>${f.t} ${esc(f.m)}</div>`).join('')}</div>
    `;
  },

  city() {

      <h2>The City Districts</h2>

        ${Object.values(DISTRICTS).map(d => {
          const ownerG = S.gangs.find(g => g.id === (S.districts[d.id] ? S.districts[d.id].owner : 0));

            <div class="box" style="border-left: 4px solid ${d.color}">

  pub() {

      <h2>The Local Alley Pub</h2>

        ${Object.entries(DRINKS).map(([id, d]) => `

            <b>${tat.n}</b> (${money(tat.p)})<br>

          </div>
        `).join('')}
      </div>
    `;
  },

  wishes() {
    return `
      <h2>The Alley Wishing Well</h2>
      <p class="m">Spend 5 Points to make a wish to the Alley Spirits.</p>
      <div class="box">
        <button class="btn-gold" onclick="act('makeWish', 'cash')">Wish for Wealth</button><br><br>
        <button class="btn-gold" onclick="act('makeWish', 'turns')">Wish for Stamina (Turns)</button><br><br>
        <button class="btn-gold" onclick="act('makeWish', 'stats')">Wish for Might (Stats)</button>
      </div>
    `;
  },

  achievements() {
    return `
      <h2>Achievements System</h2>
      <div class="box">
        ${ACHIEVEMENTS.map(ach => `
          <div style="margin-bottom:8px; border-bottom:1px solid #333; padding-bottom:4px;">
            <b>${ach.n}</b> ${S.achievements[ach.id] ? '<span class="badge">UNLOCKED</span>' : ''}<br>
            <span class="m">${ach.d} (Reward: ${ach.reward})</span>
          </div>

    `;
  },

  pack() {
    const ids = Object.keys(S.inv);
    return `
      <h2>Your Backpack</h2>
      <p>Slots Used: ${invN()}/${cap()}</p>
      ${ids.length ? `<table class="t">
        <tr><th>Item</th><th>Type</th><th>Action</th></tr>
        ${ids.map(id => `
          <tr>
            <td>${GEAR[id] ? GEAR[id].n : id} x${S.inv[id]}</td>

            <td><button onclick="act('equip', '${id}')">Equip</button></td>
          </tr>
        `).join('')}
      </table>` : '<i>Backpack is empty.</i>'}
    `;

  depot() {
    const p = Math.floor(8 + 0.8 * Math.min(S.lv, 200));
    return `
      <h2>Can Depot</h2>
      <p>You currently have <b>${S.cans}</b> aluminum cans.</p>

    `;

};

function act(actionName, ...args) {
  if (!A[actionName]) return;
  const res = A[actionName](...args);
  if (res) note = res;
  save();
  render();
}

function render() {
  topbar();
  botnav();
  const container = document.getElementById('c');
  const viewFn = VIEWS[view] || VIEWS.home;
  container.innerHTML = (note ? `<div class="box" style="border-color:var(--accent-gold)"><b>${esc(note)}</b></div>` : '') + viewFn();
}

// Initial Boot
load();
if (!S) setView('home');
render();
setInterval(() => { tick(); topbar(); }, 1000);
</script>
