  const n=new Date(),mx=mhpOf(S.lv);
  document.getElementById('top').innerHTML=`<table><tr><td class="nav" style="width:36%"><b>Alley Wars</b></td><td class="m" style="width:20%">${n.toLocaleTimeString()}</td></tr></table>
 <table><tr><td><b>Cash</b> ${money(S.cash)}<br><b>Bank</b> ${money(S.bank)}<br><b>Points</b> ${S.pts}<br><b>Tokens</b> ${S.tok.toLocaleString()}</td><td><b>Level</b> ${S.lv}<br><b>Life</b> ${Math.round(S.hp/mx*100)}%<br><b>Awake</b> ${S.T}/100<br><b>Turns</b> ${S.turns}</td><td style="width:30%">${bar(S.xp,need(S.lv),'#555')}${bar(S.hp,mx,'#3c3')}${bar(S.T,100,'#f66')}</td></tr></table>`;
}

/* ===== VIEWS ===== */
const V={
home(){const mx=mhpOf(S.lv);
 return`<div class="box"><b>My Hobo</b> · Main · ${GO('Food','food')} · ${GO('Backpack','pack')} · ${GO('Appearance','appear')} · ${GO('Donator','don')}</div>
 <div class="col"><div>${av(S.app,110)}</div><div style="flex:2"><b>Name:</b> ${esc(S.name)} (${S.id})<br><b>Gang:</b> ${S.gang?S.gang:'None'}<br><b>Level:</b> ${S.lv}<br><b>Exp:</b> ${S.xp}/${need(S.lv)}<br>
 <b>Life:</b> ${Math.ceil(S.hp)}/${mx}<br><b>Awake:</b> ${S.T}/100<br><b>Cans:</b> ${S.cans}<br><b>Tokens:</b> ${S.tok.toLocaleString()}</div></div>`},
pack(){return`<h2>Backpack</h2><p>Items in pack: ${invN()}/${cap()}</p>${Object.keys(S.inv).length?Object.keys(S.inv).map(i=>`<div>${GEAR[i].n} x${S.inv[i]}</div>`).join(''):'<i>Empty backpack.</i>'}`},
city(){return`<h2>City</h2><div class="col"><div><b>Locations</b><br>• ${GO('Hobo Meeting Area','fight')}<br>• ${GO('Can Depot','loc:depot')}<br>• ${GO('Toy Store','loc:toy')}<br>• ${GO('Gangs Alley','alley')}</div></div>`},
fight(){return`<h2>Hobo Meeting Area</h2><p>Challenge local simulated hobos!</p><div class="box"><button data-a="fight_sim">Battle Random Rival (5 Awake)</button></div>`},
chat(){return`<h2>Gang Chat</h2><div class="box log"><div>[System] Offline simulation active.</div></div><input id="cm" placeholder="Say something..."><button data-a="say">Send</button>`}
};

const LOC={
depot(){return`<h2>Can Depot</h2><p>You have <b>${S.cans}</b> cans.</p><button data-a="sell_cans">Sell All Cans</button>`},
toy(){return`<h2>Toy Store</h2><p>Buy basic weapons and armor.</p>${Object.entries(GEAR).slice(0,5).map(([id,g])=>`<div>${g.n} ($${g.p}) <button data-a="buy" data-v="${id}">Buy</button></div>`).join('')}`}
};

function render(){
  const el=document.getElementById('c');
  if(!S) load();
  topbar();
  
  // Update Bottom Nav Active Class
  document.querySelectorAll('.nav-item').forEach(function(item) {
    if(item.getAttribute('data-v') === view) item.classList.add('active');
    else item.classList.remove('active');
  });

  let h='';
  const[vw,id]=view.split(':');
  if(vw==='loc') h=LOC[id]?LOC[id]()+bk():'';
  else h=V[vw]?V[vw]():V.home();
  
  el.innerHTML=(note?`<div class="box"><b>${esc(note)}</b></div>`:'')+h;
}

/* ===== ROBUST EVENT DELEGATION ===== */
document.addEventListener('click', function(e) {
  var target = e.target.closest('[data-a], [data-v], a, button');
  if(!target) return;

  var action = target.getAttribute('data-a') || target.dataset.a;
  var val = target.getAttribute('data-v') || target.dataset.v;

  note = '';

  if(action === 'go' || (val && !action)) {
    e.preventDefault();
    view = val || action;
    window.scrollTo(0,0);
    render();
    return;
  }

  if(action === 'fight_sim') {
    if(S.T < 5) note = 'Not enough Awake!';
    else {
      S.T -= 5;
      S.xp += 15;
      S.cash += 20;
      note = 'Won the battle! +15 XP, +$20';
    }
  } else if(action === 'sell_cans') {
    var payout = S.cans * 5;
    S.cash += payout;
    note = 'Sold ' + S.cans + ' cans for $' + payout;
    S.cans = 0;
  } else if(action === 'buy' && GEAR[val]) {
    if(S.cash < GEAR[val].p) note = 'Not enough cash!';
    else {
      S.cash -= GEAR[val].p;
      S.inv[val] = (S.inv[val] || 0) + 1;
      note = 'Bought ' + GEAR[val].n;
    }
  }

  save();
  render();
});

load();
render();
</script></body></html>
