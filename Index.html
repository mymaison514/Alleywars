<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Alley Wars v2 (Offline RPG)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding-bottom: 70px; background: #121212; color: #e0e0e0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, Verdana, sans-serif; }
  a { color: #64b5f6; cursor: pointer; text-decoration: none; }
  #top { position: sticky; top: 0; background: #1e1e1e; border-bottom: 2px solid #333; padding: 6px 10px; font-size: 12px; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
  #top table { width: 100%; border-collapse: collapse; }
  #top td { vertical-align: top; padding: 2px 4px; }
  .bar { height: 8px; border: 1px solid #444; background: #222; margin: 2px 0; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; transition: width 0.2s; }
  #c { padding: 12px; max-width: 600px; margin: auto; }
  h2 { font-size: 18px; margin: 10px 0 6px; border-bottom: 1px solid #444; color: #fff; padding-bottom: 4px; }
  .box { background: #1e1e1e; border: 1px solid #333; padding: 10px; margin: 8px 0; border-radius: 6px; }
  .col { display: flex; flex-wrap: wrap; gap: 10px; }
  .col > div { flex: 1; min-width: 140px; }
  table.t { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0; }
  .t td, .t th { border: 1px solid #333; padding: 6px; text-align: left; }
  .t th { background: #252525; }
  button, input, select { font: inherit; padding: 6px 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; margin: 2px 0; }
  button:active { background: #444; }
  .g { color: #81c784; } .r { color: #e57373; } .m { color: #999; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 2px; max-width: 330px; margin: 10px auto; }
  .grid i { aspect-ratio: 1; background: #2a2a2a; font-style: normal; font-size: 10px; display: flex; align-items: center; justify-content: center; border-radius: 2px; }
  .grid i.v { background: #2e7d32; } .grid i.p { background: #c62828; color: #fff; font-weight: bold; }
  .log { max-height: 220px; overflow-y: auto; font: 12px/1.3 monospace; background: #0a0a0a; padding: 8px; border-radius: 4px; border: 1px solid #222; }
  
  /* Mobile Bottom Navigation Bar */
  #bnav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #1a1a1a; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
  .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa; font-size: 11px; flex: 1; height: 100%; text-decoration: none; }
  .nav-item.active { color: #64b5f6; font-weight: bold; }
  .nav-icon { font-size: 18px; margin-bottom: 2px; }
  
  #err-log { position: fixed; top: 0; left: 0; right: 0; background: #b71c1c; color: white; padding: 8px; font-size: 12px; z-index: 9999; display: none; }
</style>
</head>
<body>

<div id="err-log"></div>
<div id="top"></div>
<div id="c"></div>

<!-- Mobile Persistent Bottom Navigation Bar -->
<div id="bnav">
  <a class="nav-item" data-a="go" data-v="home"><span class="nav-icon">🏠</span>Home</a>
  <a class="nav-item" data-a="go" data-v="pack"><span class="nav-icon">🎒</span>Backpack</a>
  <a class="nav-item" data-a="go" data-v="city"><span class="nav-icon">🏙️</span>City Map</a>
  <a class="nav-item" data-a="go" data-v="fight"><span class="nav-icon">👊</span>Fight</a>
  <a class="nav-item" data-a="go" data-v="chat"><span class="nav-icon">💬</span>Gang Chat</a>
</div>

<script>
'use strict';

// Global Safety Error Handler
window.onerror = function(msg, url, lineNo) {
  var err = document.getElementById('err-log');
  if(err) {
    err.style.display = 'block';
    err.innerHTML = '<b>JS Runtime Error:</b> ' + msg + ' (Line ' + lineNo + ')';
  }
  return false;
};

const CONFIG = { KEY: 'alleywars_v2', VER: 2, pop: 100, gridN: 100 };

function newState(name) {
  return {
    v: CONFIG.VER,
    name: name || 'Hobo',
    lv: 1, xp: 0, cash: 50, bank: 100, pts: 5, tok: 100,
    hp: 20, maxHp: 20, T: 100, turns: 100, cans: 0,
    spd: 2, pow: 2, str: 2, int: 2, beg: 1.0,
    pos: { x: 50, y: 50 },
    inv: {}, eq: { wep: null, arm: null },
    visited: [], finds: [], log: []
  };
}

let S = null;
let view = 'home';
let note = '';

function save() {
  try { localStorage.setItem(CONFIG.KEY, JSON.stringify(S)); } catch(e){}
}

function load() {
  try {
    var raw = localStorage.getItem(CONFIG.KEY);
    if(raw) S = JSON.parse(raw);
  } catch(e){}
  if(!S) S = newState('Hobo');
}

function render() {
  var top = document.getElementById('top');
  var c = document.getElementById('c');
  
  if(!S) S = newState('Hobo');

  // Top Bar Status
  top.innerHTML = `
    <table>
      <tr>
        <td><b>${S.name}</b> (Lv ${S.lv})</td>
        <td style="text-align:right"><b>Cash:</b> $${S.cash} | <b>Bank:</b> $${S.bank}</td>
      </tr>
      <tr>
        <td colspan="2">
          <div class="bar"><i style="width:${(S.hp/S.maxHp)*100}%;background:#4caf50"></i></div>
          <div style="font-size:10px;display:flex;justify-content:space-between">
            <span>HP: ${S.hp}/${S.maxHp}</span>
            <span>Awake: ${S.T}/100</span>
            <span>Turns: ${S.turns}</span>
          </div>
        </td>
      </tr>
    </table>
  `;

  // Update Nav Bar Active Highlights
  document.querySelectorAll('.nav-item').forEach(function(el) {
    if(el.getAttribute('data-v') === view) el.classList.add('active');
    else el.classList.remove('active');
  });

  // Render Views
  var html = '';
  if(note) html += `<div class="box" style="border-color:#64b5f6">${note}</div>`;

  if(view === 'home') {
    html += `
      <h2>My Hobo Dashboard</h2>
      <div class="box">
        <p><b>Level:</b> ${S.lv} (${S.xp} XP)</p>
        <p><b>Stats:</b> Speed: ${S.spd} | Power: ${S.pow} | Strength: ${S.str}</p>
        <p><b>Intelligence:</b> ${S.int} | <b>Begging Multiplier:</b> x${S.beg.toFixed(2)}</p>
      </div>
      <button data-a="rest">Rest (+20 Awake)</button>
    `;
  } else if(view === 'pack') {
    html += `
      <h2>Backpack</h2>
      <div class="box">
        <p><b>Cans Collected:</b> ${S.cans}</p>
        <p><b>Points:</b> ${S.pts} | <b>Tokens:</b> ${S.tok}</p>
      </div>
    `;
  } else if(view === 'city') {
    html += `
      <h2>City Map</h2>
      <div class="box">
        <p>Current Location: (${S.pos.x}, ${S.pos.y})</p>
        <button data-a="move" data-v="0,-1">North ↑</button><br>
        <button data-a="move" data-v="-1,0">West ←</button>
        <button data-a="move" data-v="1,0">East →</button><br>
        <button data-a="move" data-v="0,1">South ↓</button>
      </div>
    `;
  } else if(view === 'fight') {
    html += `
      <h2>Hobo Fights</h2>
      <div class="box">
        <p>Challenge local hobos to earn cash and experience!</p>
        <button data-a="fight_npc">Fight Street Rival (5 Awake)</button>
      </div>
    `;
  } else if(view === 'chat') {
    html += `
      <h2>Gang Chat</h2>
      <div class="box log">
        <div>[System]: Welcome to Alley Wars Gang Chat.</div>
        <div>[Big Mike]: Anyone selling cans today?</div>
      </div>
      <input type="text" placeholder="Type a message..." style="width:70%">
      <button>Send</button>
    `;
  }

  c.innerHTML = html;
}

// Global Robust Event Router
document.addEventListener('click', function(e) {
  var target = e.target.closest('[data-a]');
  if(!target) return;

  e.preventDefault();
  var action = target.getAttribute('data-a');
  var val = target.getAttribute('data-v');

  note = '';

  if(action === 'go') {
    view = val;
    window.scrollTo(0, 0);
  } else if(action === 'rest') {
    S.T = Math.min(100, S.T + 20);
    note = 'Rested! Awake increased.';
  } else if(action === 'move') {
    if(S.turns <= 0) {
      note = 'No turns left!';
    } else {
      var coords = val.split(',').map(Number);
      S.pos.x += coords[0];
      S.pos.y += coords[1];
      S.turns--;
      if(Math.random() < 0.5) {
        var found = Math.floor(Math.random() * 5) + 1;
        S.cans += found;
        note = 'Moved to (' + S.pos.x + ',' + S.pos.y + ') and found ' + found + ' cans!';
      } else {
        note = 'Moved to (' + S.pos.x + ',' + S.pos.y + ').';
      }
    }
  } else if(action === 'fight_npc') {
    if(S.T < 5) {
      note = 'Not enough Awake!';
    } else {
      S.T -= 5;
      S.xp += 10;
      S.cash += 15;
      note = 'Won the fight! Gained 10 XP and $15.';
    }
  }

  save();
  render();
});

// Initialization
load();
render();
</script>
</body>
</html>
